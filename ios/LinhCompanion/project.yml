name: LinhCompanion
options:
  bundleIdPrefix: ai.linh
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  LinhCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Socrates
        CFBundleShortVersionString: "0.9"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [screen-capture, audio]
        NSMicrophoneUsageDescription: "Socrates chỉ nghe khi bạn bật hội thoại. Âm thanh không được lưu hay gửi lên mạng."
        NSSpeechRecognitionUsageDescription: "Socrates nhận dạng tiếng nói trên thiết bị khi bạn cho phép."
    entitlements:
      path: Sources/Linh.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.linh.companion]
    dependencies:
      - target: LinhBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.linh.companion
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  LinhBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BroadcastExtension
      - path: Sources/GameInsight.swift
      - path: Sources/GameReasoner.swift
      - path: Sources/SeasonKnowledge.swift
      - path: Sources/GameEvidenceLedger.swift
      - path: Sources/LinhSharedStore.swift
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: "Socrates Screen Observation"
        CFBundleShortVersionString: "0.9"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/LinhBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.linh.companion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.linh.companion.broadcast
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
