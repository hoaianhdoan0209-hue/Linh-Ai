<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Socrates">
<meta name="description" content="Trò chuyện cùng Socrates ngay trên iPhone: Socrates phản hồi bằng chữ, có giọng đọc và nhớ mạch trò chuyện trong phiên.">
<title>Socrates — người bạn thông thái</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0;overflow-x:hidden;overflow-y:auto}
body{
 min-height:100dvh;
 background:
 radial-gradient(ellipse 68% 48% at 49% 52%,#213f784f 0%,#17234f26 56%,transparent 84%),
 radial-gradient(ellipse 48% 60% at 91% 10%,#231a4c 0%,transparent 72%),
 #070b18;
 color:#edf6ff;-webkit-tap-highlight-color:transparent
}
main{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));gap:10px}
.character-name{font-size:12px;font-weight:780;letter-spacing:.33em;color:#b9d7ffb5;text-align:center;margin-top:6px;margin-bottom:-24px;z-index:1;pointer-events:none}
.world{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding-top:clamp(0px,3vh,24px)}
.stage{width:min(86vw,355px);height:min(86vw,355px);max-height:48dvh;min-height:224px;display:grid;place-items:center;position:relative}
.stage::before{
 content:"";position:absolute;inset:9%;border-radius:50%;
 background:radial-gradient(circle,#527ee750 0%,#734cd922 37%,transparent 72%);
 filter:blur(25px);animation:breathe 5.4s ease-in-out infinite
}
.ring{position:absolute;width:91%;aspect-ratio:1;border-radius:50%;border:1px solid #9bc9f617;box-shadow:0 0 26px #3567ff08;pointer-events:none}
.ring::after{content:"";position:absolute;inset:13%;border-radius:50%;border:1px dashed #d4dbff12}
.particle{position:absolute;width:5px;height:5px;border-radius:50%;background:#a7eeffb8;box-shadow:0 0 14px #9ee7ffbb;pointer-events:none;animation:twinkle 4.6s ease-in-out infinite}
.p1{left:6%;top:31%}.p2{right:9%;top:24%;animation-delay:1.8s}.p3{right:16%;bottom:17%;animation-delay:3s}.p4{left:16%;bottom:26%;animation-delay:2.5s}
.linh{appearance:none;border:0;background:transparent;display:block;position:relative;width:244px;height:244px;max-width:69vw;max-height:69vw;touch-action:manipulation;cursor:pointer;filter:drop-shadow(0 24px 34px #090f29);animation:bob 4s ease-in-out infinite}
.linh:focus-visible{outline:3px solid #8ae9f8;outline-offset:10px;border-radius:50%}
.linh .body{position:absolute;inset:10%;border-radius:49% 53% 49% 52%;background:radial-gradient(ellipse at 30% 18%,#f9ffff 0%,#aff6ff 18%,#74c5ff 38%,#706be0 79%,#a76df3 100%);box-shadow:inset 0 0 0 4px #ffffff54,inset -12px -18px 26px #4434a255,0 0 34px #7aa9ffa0;animation:wobble 4.2s ease-in-out infinite;transition:box-shadow .35s,filter .35s}
.linh .body::before{content:"";position:absolute;top:13%;left:19%;width:27%;height:12%;border-radius:50%;background:#ffffffb0;transform:rotate(-27deg);filter:blur(3px)}
.face{position:absolute;inset:0;pointer-events:none}
.eye{position:absolute;top:45%;width:12px;height:18px;border-radius:50%;background:#1d2c58;animation:blink 6.4s infinite}
.eye.l{left:37%}.eye.r{right:37%}
.cheek{position:absolute;top:57%;width:16px;height:10px;border-radius:50%;background:#ff9fc4a8}
.cheek.l{left:28%}.cheek.r{right:28%}
.mouth{position:absolute;top:59%;left:47%;width:15px;height:9px;border-bottom:3px solid #21315c;border-radius:0 0 50% 50%;transition:all .18s}
.linh.talking .mouth{height:16px;width:13px;top:57%;left:47%;background:#27336c;border-radius:50%;border:0}
.linh.talking .body{box-shadow:inset 0 0 0 4px #ffffff80,0 0 58px #81e8e3b5;filter:saturate(1.17)}
.linh.happy .mouth{width:22px;height:13px;left:45%;top:58%;border-bottom-width:4px}
.linh.thinking .eye.r{transform:scaleY(.38)}
.linh.is-holding .body{filter:brightness(1.18)}
.linh.bloom{animation:reaction .5s ease-out,bob 4s ease-in-out infinite}
.speech{width:min(86vw,330px);min-height:60px;display:grid;place-items:center;position:relative;margin-top:-6px}
.thought{font-size:14px;font-weight:540;line-height:1.48;letter-spacing:.005em;max-width:330px;text-align:left;white-space:pre-line;max-height:38dvh;overflow-y:auto;padding:12px 16px;border-radius:17px;color:#eff9ff;background:#152442dc;border:1px solid #79baf32f;box-shadow:0 13px 28px #050b1d44;opacity:0;transform:translateY(8px) scale(.98);transition:opacity .28s,transform .28s;pointer-events:auto}
.thought.show{opacity:1;transform:translateY(0) scale(1)}
.thought[data-kind="calculation"]{border-color:#8de6bc6b}
.thought[data-kind="memory"]{border-color:#b2a2ff68}
.said{min-height:18px;max-width:330px;color:#a9b9d9;font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 0 7px}
.chat-dock{display:flex;align-items:center;gap:8px;width:min(91vw,385px);background:#131e36ec;border:1px solid #89c8ff4e;border-radius:24px;padding:7px 8px 7px 15px;box-shadow:0 14px 35px #01051666;margin-top:13px}
.chat-dock[hidden]{display:none!important}
.chat-dock input{appearance:none;background:transparent;min-width:0;flex:1;color:#eef9ff;border:none;outline:none;font:400 16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;caret-color:#a7e9ff}
.chat-dock input::placeholder{color:#8195b5}
.chat-dock button{display:grid;place-items:center;flex:none;width:38px;height:38px;border:0;border-radius:50%;background:#5077ba;color:#f7fdff;cursor:pointer;font-size:18px;line-height:1}
.chat-dock button:focus-visible{outline:2px solid #b5f5ff;outline-offset:3px}
.chat-dock #mic{background:#273c63}
.chat-dock #mic[hidden]{display:none!important}
.chat-dock #mic.listening{background:#9c476f}
.chat-dock #photo{background:#273c63}
.chat-dock input[type=file]{display:none}
.chat-dock:focus-within{border-color:#b4f1ff88}
.photo-review{width:min(91vw,385px);max-height:min(38dvh,310px);overflow-y:auto;padding:11px 12px;background:#101b33;border:1px solid #75b0e350;border-radius:18px;margin:10px auto 0;box-shadow:0 10px 32px #05091763}
.photo-review[hidden],.photo-review [hidden]{display:none!important}
.ai-setup label{display:block;font-size:11px;color:#e0efff;margin:6px 0 3px}
.ai-setup input{width:100%;box-sizing:border-box;border:1px solid #7295c380;border-radius:8px;background:#111f38;color:#f3f8ff;padding:9px;font-size:13px}
.photo-top{display:flex;align-items:center;gap:11px}
.photo-top img{width:66px;height:66px;object-fit:cover;border-radius:11px;border:1px solid #86b5e85a}
.photo-top p{font-size:12px;line-height:1.45;margin:0;flex:1;color:#e5f5ff;overflow-wrap:anywhere}
.photo-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-actions button,.erase-memory{appearance:none;border:1px solid #6687b659;background:#273c63;border-radius:11px;color:#e9f7ff;padding:8px 12px;font-size:12px;cursor:pointer}
.photo-actions button.primary{background:#4165a0;border-color:#8ed2fd75;font-weight:650}
.photo-actions button:disabled{opacity:.4;cursor:not-allowed}
.erase-memory{margin-top:6px;font-size:11px;opacity:.77;background:transparent;border-color:transparent}
.erase-memory[hidden]{display:none!important}
.subtle{max-width:380px}
.chatting .world{min-height:0;padding-top:0}
.chatting .stage{height:min(45dvh,275px);min-height:145px}
.chatting .linh{width:190px;height:190px;max-width:49vw;max-height:49vw}
.chatting .speech{min-height:90px;margin-top:-3px}
.chatting .thought{max-width:330px}
.chatting .subtle{letter-spacing:0}
.subtle{font-size:10px;line-height:1.45;letter-spacing:.05em;text-align:center;color:#92a7c8ab;margin:0;user-select:none}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@keyframes bob{0%,100%{transform:translateY(4px)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{transform:scale(.95);opacity:.72}50%{transform:scale(1.1);opacity:1}}
@keyframes wobble{0%,100%{border-radius:49% 53% 49% 52%;rotate:-2deg}50%{border-radius:54% 46% 53% 45%;rotate:3deg}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes twinkle{0%,100%{opacity:.25;scale:.8}50%{opacity:.9;scale:1.4}}
@keyframes reaction{0%{scale:1}44%{scale:1.09}100%{scale:1}}
@media(max-height:570px){.world{min-height:0;padding-top:0}.stage{max-height:55dvh}.speech{min-height:54px;margin-top:-12px}.linh{max-height:52dvh;max-width:52dvh}.thought{font-size:12px;padding:9px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="world">
    <div class="character-name" aria-label="Tên nhân vật Socrates">SOCRATES</div>
    <div class="stage">
      <span class="ring" aria-hidden="true"></span>
      <i class="particle p1" aria-hidden="true"></i><i class="particle p2" aria-hidden="true"></i>
      <i class="particle p3" aria-hidden="true"></i><i class="particle p4" aria-hidden="true"></i>
      <button type="button" class="linh" id="linh" aria-label="Socrates. Chạm để trò chuyện. Giữ để bật hoặc tắt giọng đọc.">
        <span class="body"></span>
        <span class="face"><span class="eye l"></span><span class="eye r"></span><span class="cheek l"></span><span class="cheek r"></span><span class="mouth"></span></span>
      </button>
    </div>
    <div class="speech">
      <div>
        <p id="said" class="said" hidden></p>
        <div id="thought" class="thought" aria-hidden="true"></div>
      </div>
    </div>
    <form id="chatDock" class="chat-dock" autocomplete="off">
      <input id="chatMessage" type="text" maxlength="900" autocomplete="off" aria-label="Nhắn cho Socrates" placeholder="Nói với Socrates…" enterkeyhint="send">
      <button id="photo" type="button" aria-label="Gửi ảnh cho Socrates" title="Chọn ảnh">▧</button>
      <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Chọn ảnh để Socrates đọc">
      <button id="mic" type="button" hidden aria-label="Nói bằng giọng nói" title="Dùng mic nếu Safari hỗ trợ">🎙</button>
      <button id="send" type="submit" aria-label="Gửi cho Socrates">➤</button>
    </form>
    <div class="photo-review" id="photoReview" hidden>
      <div class="photo-top">
        <img id="imagePreview" alt="Ảnh Bệ hạ vừa chọn" hidden>
        <p id="imageStatus" role="status" aria-live="polite">Socrates chờ ảnh của Bệ hạ.</p>
      </div>
      <div class="photo-actions">
        <button type="button" id="approveImage" class="primary" disabled>Ghi nhớ điều đã đọc</button>
        <button type="button" id="dismissImage">Bỏ qua</button>
      </div>
    </div>
  </div>
  <div class="photo-review ai-setup" id="aiSetup" hidden>
    <label for="aiEndpoint">URL HTTPS của cổng AI riêng, kết thúc bằng /chat</label>
    <input id="aiEndpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://ten-may-chu.example/chat">
    <label for="aiAccess">Mã truy cập gateway (không phải khóa API Gemini/OpenAI)</label>
    <input id="aiAccess" type="password" autocomplete="off" maxlength="256" placeholder="Mã truy cập chỉ giữ trong phiên">
    <div class="photo-actions">
      <button id="aiConnect" class="primary" type="button">Kết nối AI</button>
      <button id="aiDismiss" type="button">Đóng</button>
    </div>
  </div>
  <button id="eraseImages" class="erase-memory" type="button" hidden>Quên các ảnh đã học</button>
  <p class="subtle" id="learnStatus">Đang tải trí nhớ cục bộ…</p>
  <p class="subtle" id="aiStatus">Đang dùng trí tuệ cục bộ · AI riêng chưa kết nối</p>
  <button id="aiSettings" class="erase-memory" type="button">Kết nối AI riêng (tùy chọn)</button>
  <span class="sr-only" id="liveStatus" aria-live="polite" aria-atomic="true"></span>
</main>
<script src="./web-companion.js"></script>
<script src="./web-dialogue.js"></script>
<script src="./web-ai-bridge.js?v=2.3.0"></script>
<script src="./stat-schema.js?v=2.2.0"></script>
<script src="./vision-engine.js?v=2.2.0"></script>
<script src="./web-image-memory.js?v=2.2.0"></script>
<script src="./season-knowledge.js?v=2.2.0"></script>
<script src="./web-game-brain.js?v=2.2.0"></script>
<script src="./web-game-experiments.js?v=2.2.0"></script>
<script src="./build-systems.js?v=2.2.0"></script>
<script src="./ss9-evidence-graph.js?v=2.2.0"></script>
<script src="./rotation-lab.js?v=2.2.0"></script>
<script src="./rotation-commands.js?v=2.2.0"></script>
<script src="./thinking-guard.js?v=2.2.0"></script>
<script src="./prompt-strategy.js?v=2.2.0"></script>
<script src="./game-coach.js?v=2.2.0"></script>
<script>
(()=>{
 'use strict';
 // Safari PWA cannot stream the screen of another app. Never imply real-time gameplay observation.
 const brain=window.LinhWebCompanion,chat=window.LinhDialogue;
 const aiBridge=window.SocratesAIBridge?.create();
 const coach=window.SocratesCoach.create();
 const vision=window.LinhVision,imageMemory=window.LinhImageMemory;
 const gameBrain=window.SocratesGameBrain,experiments=window.SocratesExperiments;
 const buildSystems=window.SocratesBuildSystems;
 const evidenceGraph=window.SocratesEvidenceGraph;
 const rotations=window.SocratesRotationCommands;
 const promptStrategy=window.SocratesPromptStrategy;
 const thinkingGuard=window.SocratesThinkingGuard;
 const linh=document.getElementById('linh');
 const thought=document.getElementById('thought');
 const live=document.getElementById('liveStatus');
 const dock=document.getElementById('chatDock');
 const field=document.getElementById('chatMessage');
 const said=document.getElementById('said');
 const mic=document.getElementById('mic');
 const photo=document.getElementById('photo');
 const imageInput=document.getElementById('imageInput');
 const photoReview=document.getElementById('photoReview');
 const imagePreview=document.getElementById('imagePreview');
 const imageStatus=document.getElementById('imageStatus');
 const approveImage=document.getElementById('approveImage');
 const dismissImage=document.getElementById('dismissImage');
 const eraseImages=document.getElementById('eraseImages');
 const learnStatus=document.getElementById('learnStatus');
 const aiSetup=document.getElementById('aiSetup'),aiSettings=document.getElementById('aiSettings');
 const aiEndpoint=document.getElementById('aiEndpoint'),aiAccess=document.getElementById('aiAccess');
 const aiConnect=document.getElementById('aiConnect'),aiDismiss=document.getElementById('aiDismiss');
 const aiStatus=document.getElementById('aiStatus');
 if(!brain||!chat||!vision||!imageMemory||!gameBrain||!experiments||!buildSystems||!evidenceGraph||!rotations||!promptStrategy||!thinkingGuard||!aiBridge||!linh||!thought){
   if(live)live.textContent='Socrates chưa tải được bộ hội thoại cục bộ.';
   return;
 }
 const get=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
 const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}};
 let session;
 try{session=brain.sanitizeState(JSON.parse(get(brain.STATE_KEY)||'null'))}
 catch(_){session=brain.freshState()}
 session=brain.startVisit(session);
 set(brain.STATE_KEY,session);
 let legacy=brain.readLegacy(get(brain.LEGACY_KEY));
 let dialogue={focus:'general'},lastPatch=null,buildContext=null,thinkingState=thinkingGuard.empty(),hideTimer,reactTimer,holdTimer,holding=false,suppressClick=false;
 let savedImages=imageMemory.sanitize(get(imageMemory.KEY));
 let gameNotes=gameBrain.sanitize(get(gameBrain.KEY));
 let measurements=experiments.sanitize(get(experiments.KEY));
 let analysisVisible=false;
 let pendingImage=null,previewURL=null,scanToken=0,scanning=false,ocrScriptPromise=null;
 let lastInteractionAt=Date.now(),lastDisplayedAt=Date.now(),proactiveCount=0;
 let recognition=null,recognizing=false;
 const clearReaction=()=>linh.classList.remove('talking','thinking','happy','bloom');
 const silence=()=>{try{window.speechSynthesis?.cancel()}catch(_){}};
 function show(message,kind='dialogue',duration=11000){
   const text=String(message||'').slice(0,4000);
   if(!text)return;
   lastDisplayedAt=Date.now();
   analysisVisible=duration===0;
   thought.textContent=text;
   thought.dataset.kind=kind;
   thought.classList.add('show');
   thought.setAttribute('aria-hidden','true');
   live.textContent=text;
   clearReaction();
   linh.classList.add(kind==='question'?'thinking':kind==='greeting'?'happy':'talking','bloom');
   clearTimeout(hideTimer);clearTimeout(reactTimer);
   reactTimer=setTimeout(clearReaction,950);
   if(duration>0)hideTimer=setTimeout(()=>thought.classList.remove('show'),duration);
 }
 function speak(message){
   if(!session.voice || !('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window))return;
   silence();
   try{
     const u=new SpeechSynthesisUtterance(message);
     u.lang='vi-VN';u.rate=1.03;
     window.speechSynthesis.speak(u);
   }catch(_){/* Browser voice is optional; text always displays. */}
 }
 function openChat(){
   // Composer is already visible. Tapping Socrates only focuses it.
   field.focus();
 }
 function send(raw){
   const input=String(raw||'').trim();
   const experiment=/^(?:mô phỏng|mo phong|tính vòng chiêu|tinh vong chieu|thu rotation|rotation)\b/iu.test(input);
   const message=input.slice(0,experiment?900:chat.MAX_INPUT);
   if(!message)return;
   lastInteractionAt=Date.now();
   field.value='';
   // Session context only; raw conversation is NOT saved to localStorage.
   const normalized=chat.norm(message);
   if(/^(bat ai rieng|ket noi ai rieng|cau hinh ai rieng)$/.test(normalized)){
     aiSetup.hidden=false;aiEndpoint.focus();
     show('Nhập URL gateway HTTPS và mã truy cập RIÊNG. Không nhập khóa API mô hình vào trình duyệt.','question',0);
     return;
   }
   if(/^(tat ai rieng|ngat ai rieng)$/.test(normalized)){
     aiBridge.disconnect();aiSetup.hidden=true;aiStatus.textContent='Đang dùng trí tuệ cục bộ · AI riêng chưa kết nối';
     aiSettings.textContent='Kết nối AI riêng (tùy chọn)';
     show('Đã ngắt AI riêng và xóa lịch sử hội thoại AI trong RAM.', 'memory',0);return;
   }
   const photoRecall=/(anh|hinh)/.test(normalized)&&/(nho|hoc|da luu|biet gi|ghi nho)/.test(normalized);
   const photoRequest=/(gui anh|gui hinh|xem anh|xem hinh|doc anh|doc hinh)/.test(normalized);
   const measurement=experiments.record(measurements,message);
   const measuredReply=measurement || experiments.answer(message,measurements);
   const rotationReply=rotations.answer(message);
   const contextual=photoRequest?null:coach.reply(message,lastPatch?[]:savedImages);
   const studied=measurement?null:gameBrain.answer(message,savedImages,gameNotes,legacy,measurements);
   const patchFollowup=gameBrain.followup(message,lastPatch);
   const clearCommand=/^(xoa hoi thoai|quen cuoc tro chuyen|xoa tro chuyen)$/.test(normalized);
   const nextBuild=clearCommand||photoRequest?null:buildSystems.inspect(message,{source:'user-text'});
   const alternativeTurn=/(?:phuong an|anh|bo|mon)\s+[ab](?:\s|$)/.test(normalized);
   // A and B are independent hypothetical equipment sets, not equipped stats.
   if(nextBuild&&!alternativeTurn)buildContext=buildSystems.merge(buildContext,nextBuild);
   if(!clearCommand&&!photoRequest){
     thinkingState=thinkingGuard.observe(thinkingState,message,{source:'user-text'});
     const check=thinkingGuard.audit(thinkingState);
     // A conflicting equipment report cannot become a trusted build input.
     if(buildContext&&thinkingState.mechanicId===buildContext.mechanicIds?.[0]){
       if(check.status==='conflict')buildContext={...buildContext,pieceCount:null};
       else if(check.pieceCount!==null)buildContext={...buildContext,pieceCount:check.pieceCount};
     }
   }
   const thinkingAdvice=photoRequest||photoRecall?null:thinkingGuard.answer(message,thinkingState);
   const buildAcknowledgment=nextBuild&&/\b(?:toi|ta|minh)\s+(?:choi|dung|dang dung|mac|su dung)\b/.test(normalized)?
     {text:'Socrates ghi nhận thông tin build trong phiên này, chưa coi là đã kiểm chứng. Muốn phân tích đúng cần hiệu ứng đang kích hoạt, Fatestone và kỹ năng chủ lực.',kind:'memory',focus:'game'}:null;
   const promptAdvice=photoRequest||photoRecall?null:promptStrategy.answer(message,{context:buildContext});
   const deepBuild=photoRequest||photoRecall?null:buildSystems.assess(message,{context:buildContext});
   const sourcedMechanic=photoRequest||photoRecall?null:evidenceGraph.explain(message);
   const groundedPatch=studied?.kind==='official-patch'?
     {...studied,text:studied.text+(deepBuild?'\n\n'+deepBuild.text:'')}:null;
   let reply=measuredReply || (studied?.action?studied:null) || rotationReply || thinkingAdvice || groundedPatch || (contextual?.kind==='calculation'?contextual:null) || sourcedMechanic || promptAdvice || deepBuild || buildAcknowledgment || (photoRequest?null:patchFollowup) || (photoRequest?null:photoRecall?null:contextual) || (photoRequest?null:studied) || (photoRecall?
     {text:imageMemory.recall(savedImages).slice(0,chat.MAX_REPLY),focus:'image',kind:'memory'}:
     photoRequest?
     {text:'Bệ hạ bấm nút ▧ cạnh ô nhắn để chọn ảnh. Socrates sẽ đọc chữ rồi hỏi trước khi lưu.',focus:'image',kind:'question'}:
     chat.respond(message,dialogue,legacy));
   if(measurement?.action==='save-measurement'){
     if(set(experiments.KEY,{version:1,items:measurement.items})){
       measurements=measurement.items;
       refreshImageMemoryUI();
     }else reply={text:'Safari không lưu được số đo; Socrates không coi đây là bằng chứng đã lưu.',kind:'question',focus:'game'};
   }else if(measuredReply?.action==='confirm-clear-measurements'){
     if(window.confirm('Xóa toàn bộ số đo game đã nhập? Trí nhớ ảnh và ghi chú vẫn giữ nguyên.')){
       if(set(experiments.KEY,{version:1,items:[]})){
         measurements=[];refreshImageMemoryUI();
         reply={text:'Đã xóa các số đo game trên máy, giữ nguyên ảnh và ghi chú.',kind:'memory',focus:'game'};
       }else reply={text:'Safari chưa xóa được số đo; Socrates chưa xác nhận đã xóa.',kind:'question',focus:'game'};
     }else reply={text:'Socrates sẽ giữ các số đo đã ghi.',kind:'memory',focus:'game'};
   }else if(studied?.action==='save-note'){
     if(set(gameBrain.KEY,{version:1,items:studied.notes})){
       gameNotes=studied.notes;
       refreshImageMemoryUI();
     }else reply={text:'Safari chưa lưu được ghi chú. Socrates sẽ không nhận là đã học.',kind:'question',focus:'game'};
   }else if(studied?.action==='confirm-clear-notes'){
     const approved=window.confirm('Bệ hạ muốn xóa toàn bộ ghi chú game đã tự nhập? Trí nhớ ảnh sẽ giữ nguyên.');
     if(approved){
       if(set(gameBrain.KEY,{version:1,items:[]})){
         gameNotes=[];refreshImageMemoryUI();
         reply={text:'Đã xóa ghi chú game do Bệ hạ nhập. Trí nhớ ảnh được giữ nguyên.',kind:'memory',focus:'game'};
       }else reply={text:'Safari chưa xóa được ghi chú, nên Socrates không xác nhận đã xóa.',kind:'question',focus:'game'};
     }else reply={text:'Socrates sẽ giữ nguyên những ghi chú game đã lưu.',kind:'memory',focus:'game'};
   }
   const clear=/^(xoa hoi thoai|quen cuoc tro chuyen|xoa tro chuyen)$/.test(chat.norm(message));
   if(clear){lastPatch=null;buildContext=null;thinkingState=thinkingGuard.empty();aiBridge.clear();}
   else if(reply===groundedPatch){
     lastPatch=studied;
     buildContext=buildSystems.merge(buildContext,buildSystems.inspect(message,{source:'user-text'}));
   }
   else if(!patchFollowup&&reply?.focus!=='game')lastPatch=null;
   dialogue=clear?{focus:'general'}:{focus:reply.focus,followUp:reply.followUp};
   if(clear){said.hidden=true;said.textContent='';}
   else{said.hidden=false;said.textContent='Bệ hạ: '+message.slice(0,90);}
   show(reply.text,reply.kind,0);
   // Local arithmetic and rule-based explanations remain authoritative.
   // Online conversation is entirely optional, approved per message.
   const deterministic=clear||photoRequest||photoRecall||reply?.kind==='calculation'||
     reply?.kind==='official-patch'||reply?.action;
   if(aiBridge.status().ready&&!deterministic){
     void aiBridge.ask(message,{
       confirm:({endpoint,body})=>window.confirm(
         'Cho phép Socrates gửi đúng JSON sau tới gateway riêng?\n'+endpoint+
         '\n\n'+body+'\n\nDữ liệu có thể được nhà cung cấp mô hình xử lý.'),
     }).then(result=>{
       if(result.ok){show(result.reply,'dialogue',0);speak(result.reply);}
       else if(!result.cancelled)show('AI riêng: '+result.reason+'\nSocrates đã giữ câu trả lời cục bộ phía trước.','question',0);
     });
   }else speak(reply.text);
 }

 function ensureTesseract(){
   if(window.Tesseract)return Promise.resolve(window.Tesseract);
   if(ocrScriptPromise)return ocrScriptPromise;
   ocrScriptPromise=new Promise((resolve,reject)=>{
     const script=document.createElement('script');
     script.src='./ocr/tesseract.min.js';
     script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('OCR chưa có sẵn'));
     script.onerror=()=>reject(new Error('Không tải được OCR'));
     document.head.appendChild(script);
   }).catch(error=>{ocrScriptPromise=null;throw error;});
   return ocrScriptPromise;
 }
 // One bounded, optional OCR retry on low-confidence screenshots; no new storage.
 async function enhancedOCRCanvas(file){
   if(typeof createImageBitmap!=='function')return null;
   const bitmap=await createImageBitmap(file);
   try{
     const scale=Math.min(2,2000/Math.max(bitmap.width,bitmap.height));
     const canvas=document.createElement('canvas');
     canvas.width=Math.max(1,Math.round(bitmap.width*scale));
     canvas.height=Math.max(1,Math.round(bitmap.height*scale));
     const ctx=canvas.getContext('2d',{willReadFrequently:true});
     if(!ctx)return null;
     ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);
     const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
     for(let i=0;i<pixels.data.length;i+=4){
       const gray=.299*pixels.data[i]+.587*pixels.data[i+1]+.114*pixels.data[i+2];
       const crisp=Math.max(0,Math.min(255,(gray-128)*1.5+128));
       pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=crisp;
     }
     ctx.putImageData(pixels,0,0);
     return canvas;
   }finally{bitmap.close?.();}
 }
 async function readImage(file){
   if(!file)return;
   lastInteractionAt=Date.now();
   closeImage();
   lastPatch=null;
   buildContext=null;
   if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>10*1024*1024){
     show('Hãy chọn ảnh PNG, JPG hoặc WebP dưới 10 MB nhé.','question',12000);
     return;
   }
   const myScan=++scanToken;
   photoReview.hidden=false;
   previewURL=URL.createObjectURL(file);
   imagePreview.src=previewURL;
   imagePreview.hidden=false;
   imageStatus.textContent='Socrates đang chuẩn bị đọc chữ trong ảnh…';
   scanning=true;
   let worker=null;
   try{
     const T=await ensureTesseract();
     if(myScan!==scanToken)return;
     const opts={
       workerPath:new URL('./ocr/worker.min.js',document.baseURI).href,
       corePath:new URL('./ocr',document.baseURI).href,
       langPath:new URL('./ocr/lang',document.baseURI).href,
       workerBlobURL:false
     };
     worker=await T.createWorker(['eng','vie'],1,opts);
     if(myScan!==scanToken)return;
     imageStatus.textContent='Socrates đang đọc chữ. Ảnh chỉ xử lý trong trình duyệt.';
     const result=await worker.recognize(file);
     if(myScan!==scanToken)return;
     let raw=String(result?.data?.text||'').trim().slice(0,12000);
     let observation=vision.observe(raw);
     // Image names and numbers are useful even without generic OCR tags.
     // Retry only when the first pass found no game evidence; never stitch
     // separate OCR passes together into an invented equipment profile.
     if(!imageMemory.candidate(raw,observation)&&
        !(window.SocratesSeasonKnowledge?.lookup(raw)||[]).length&&raw.length<200){
       let secondCanvas=null;
       try{
         imageStatus.textContent='Chữ chưa rõ, Socrates thử đọc ảnh nét hơn…';
         secondCanvas=await enhancedOCRCanvas(file);
         if(myScan!==scanToken)return;
         if(secondCanvas){
           const second=await worker.recognize(secondCanvas);
           if(myScan!==scanToken)return;
           const secondText=String(second?.data?.text||'').trim().slice(0,12000);
           const secondObservation=vision.observe(secondText);
           const useful=imageMemory.candidate(secondText,secondObservation)||
             (window.SocratesSeasonKnowledge?.lookup(secondText)||[]).length;
           if(useful){raw=secondText;observation=secondObservation;}
         }
       }catch(retryError){
         console.warn('Optional OCR retry unavailable:',retryError?.name);
       }finally{
         if(secondCanvas){secondCanvas.width=0;secondCanvas.height=0;}
       }
     }
     pendingImage=imageMemory.candidate(raw,observation);
     approveImage.disabled=!pendingImage;
     imageStatus.textContent=imageMemory.describe(pendingImage);
     // A named SS9 mechanic can be recognized even when OCR finds no numeric
     // stats or generic tags. Answer the relevant question without saving OCR.
     const named=window.SocratesSeasonKnowledge?.lookup(raw)||[];
     const sourcedOCR=evidenceGraph.explain(raw);
     lastPatch=named[0]||null;
     buildContext=buildSystems.inspect(raw,{source:'image'});
     thinkingState=thinkingGuard.observePhoto(thinkingState,raw);
     if(pendingImage){
       const analysis=coach.image(pendingImage);
       const mechanics=buildContext?buildSystems.assess('phân tích cơ chế',{context:buildContext}):null;
       show(analysis.text+(named.length?'\n\n'+named[0].text:'')+(sourcedOCR?'\n\n'+sourcedOCR.text:'')+(mechanics?'\n\n'+mechanics.text:''),analysis.kind,0);
       return;
     }
     if(named.length){
       coach.reset();
       imageStatus.textContent='Đã nhận ra tên cơ chế SS9, nhưng chưa đọc được chỉ số đủ tin cậy; ảnh không được ghi nhớ.';
       const mechanics=buildSystems.assess('phân tích cơ chế',{context:buildContext});
       show(named[0].text+(sourcedOCR?'\n\n'+sourcedOCR.text:'')+(mechanics?'\n\n'+mechanics.text:''),'question',0);
       return;
     }
     show('Socrates chưa đọc rõ chữ trong ảnh này. Thử ảnh nét hơn nhé.','question',14000);
   }catch(error){
     console.warn('Socrates OCR failed:',error?.name,error?.message);
     if(myScan===scanToken){
       imageStatus.textContent='OCR chưa chạy được. Thử lại khi có mạng để tải bộ chữ từ Socrates.';
       show('Ảnh vẫn ở trên máy. Socrates chưa đọc được chữ, và chưa lưu gì.','question');
     }
   }finally{
     if(worker)try{await worker.terminate()}catch(_){}
     if(myScan===scanToken)scanning=false;
   }
 }

 const proactive=[
   'Socrates ở đây. Bệ hạ muốn kể chuyện hay gửi ảnh cho Socrates xem?',
   'Nếu có ảnh kỹ năng, chạm ▧; Socrates có thể thử đọc chữ và hỏi trước khi nhớ.',

 function autonomousThought(){
   const now=Date.now();
   if(analysisVisible||document.hidden||scanning||!photoReview.hidden||recognizing)return;
   if(proactiveCount>=4||now-lastInteractionAt<30000||
      now-lastDisplayedAt<(proactiveCount===0?28000:85000)||
      field.value.trim().length)return;
   let message=proactive[proactiveCount];
   if(proactiveCount===2)
     message=gameBrain.nextStudyPrompt(savedImages,gameNotes) ||
       (measurements.length?'Socrates đã ghi '+measurements.length+
       ' số đo. Hỏi “so sánh số đo” để kiểm tra nhé.':message);
   proactiveCount++;
   show(message,'question',12000);
   // iOS may deny speech playback without a fresh user gesture. Text remains.
   speak(message);
 }
