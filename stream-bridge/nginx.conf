load_module modules/ngx_rtmp_module.so;
worker_processes 1;
pid /tmp/linh-nginx.pid;
error_log /dev/stderr error;
events { worker_connections 256; }
rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      record off;
      on_publish http://127.0.0.1:8080/internal/publish;
      on_publish_done http://127.0.0.1:8080/internal/done;
      allow play 127.0.0.1;
      deny play all;
    }
  }
}
http {
  access_log off;
  server {
    listen 127.0.0.1:8081;
    location = /ping { return 200 "ok"; }
  }
}
