name: Linh iOS 18–27 — Build miễn phí
on:
  push:
    paths:
      - 'ios/LinhCompanion/Sources/**'
      - 'ios/LinhCompanion/sign_on_mac.py'
      - 'ios/LinhCompanion/prepare_cloud_signing.py'
      - 'codemagic.yaml'
      - 'ios/LinhCompanion/Tests/**'
      - 'ios/LinhCompanion/project.yml'
      - 'ios/LinhCompanion/BroadcastExtension/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    name: Build ứng dụng Linh iOS 18–27 bằng Xcode 27
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử chuẩn bị ký (không dùng chứng chỉ thật)
        run: |
          python3 -m py_compile ios/LinhCompanion/sign_on_mac.py
          python3 ios/LinhCompanion/sign_on_mac.py \
            --team ABCDE12345 \
            --device 00008020-001111122223000A \
            --check-only
      - name: Kiểm tra dự án cloud signing (không dùng Apple keys)
        run: |
          set -euo pipefail
          python3 -m py_compile ios/LinhCompanion/prepare_cloud_signing.py
          python3 ios/LinhCompanion/prepare_cloud_signing.py \
            --bundle-id com.linh.example.testapp \
            --build-number 127 \
            --output /tmp/LinhCloudTest
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = Path('/tmp/LinhCloudTest/project.yml').read_text()
          picker = Path('/tmp/LinhCloudTest/Sources/ReplayKitPicker.swift').read_text()
          shared = Path('/tmp/LinhCloudTest/Sources/LinhSharedStore.swift').read_text()
          catalog = Path('/tmp/LinhCloudTest/Sources/Assets.xcassets/AppIcon.appiconset/Contents.json')
          assert project.count('com.apple.security.application-groups:') == 2
          assert project.count('CFBundleVersion: "127"') == 2
          assert project.count('ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"') == 1
          assert 'com.linh.example.testapp.broadcast' in picker
          assert 'group.com.linh.example.testapp' in shared
          assert json.loads(catalog.read_text())['images'][0]['size'] == '1024x1024'
          assert Path('/tmp/LinhCloudTest/LinhIcon.svg').is_file()
          print('PASS: cloud project IDs, ReplayKit, App Group, AppIcon, build number')
          PY
          ruby -e 'require "yaml"; y=YAML.load_file("codemagic.yaml"); raise "Missing workflow" unless y.dig("workflows", "linh-testflight", "environment", "ios_signing", "distribution_type") == "app_store"; puts "PASS: codemagic.yaml valid"'
      - name: Kiểm tra bộ SDK Apple
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Tạo project Xcode (XcodeGen)
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          cd ios/LinhCompanion
          xcodegen generate
      - name: Biên dịch iPhone app (không ký, không phát hành)
        run: |
          cd ios/LinhCompanion
          xcodebuild -project LinhCompanion.xcodeproj \
            -scheme LinhCompanion \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/LinhBuild \
            CODE_SIGNING_ALLOWED=NO build
      - name: Kiểm thử hội thoại giọng nói Socrates cục bộ
        run: |
          swiftc ios/LinhCompanion/Sources/SeasonKnowledge.swift \
            ios/LinhCompanion/Sources/SocratesVoiceDialog.swift \
            ios/LinhCompanion/Tests/SocratesVoiceDialogTests.swift \
            -o /tmp/SocratesVoiceTests
          /tmp/SocratesVoiceTests
      - name: Kiểm tra ứng dụng và ReplayKit Extension trong gói iOS 18+
        run: |
          set -euo pipefail
          APP=/tmp/LinhBuild/Build/Products/Debug-iphoneos/LinhCompanion.app
          EXT="$APP/PlugIns/LinhBroadcast.appex"
          test -d "$APP"
          test -d "$EXT"
          echo "APP INFO:"
          plutil -p "$APP/Info.plist" | head -45
          echo "EXTENSION INFO:"
          plutil -p "$EXT/Info.plist" | head -80
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist" | grep -Fx 'ai.linh.companion'
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXT/Info.plist" | grep -Fx 'ai.linh.companion.broadcast'
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT/Info.plist" | grep -Fx 'com.apple.broadcast-services-upload'
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$APP/Info.plist" | grep -Fx 'screen-capture'
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:1" "$APP/Info.plist" | grep -Fx 'audio'
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Info.plist" | grep -F 'Socrates'
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$APP/Info.plist" | grep -F 'Socrates'
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" | grep -Fx '18.0'
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$EXT/Info.plist" | grep -Fx '18.0'
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPrincipalClass" "$EXT/Info.plist" | grep -Fx 'LinhBroadcast.SampleHandler'
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:RPBroadcastProcessMode" "$EXT/Info.plist" | grep -Fx 'RPBroadcastProcessModeSampleBuffer'
          # XcodeGen rewrites entitlements; check the GENERATED files as well.
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" ios/LinhCompanion/Sources/Linh.entitlements | grep -Fx 'group.ai.linh.companion'
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" ios/LinhCompanion/BroadcastExtension/LinhBroadcast.entitlements | grep -Fx 'group.ai.linh.companion'
          # CI creates an unsigned binary. This is NOT an installable IPA.
          if codesign --verify "$APP" >/dev/null 2>&1; then
            echo "Unexpectedly signed build: publishing is not permitted"; exit 1
          fi
          echo "PASS: both iOS18 targets packaged, expected identifiers, UNSIGNED"
      - name: Đóng gói bản không ký cho kiểm tra nội bộ
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            /tmp/LinhBuild/Build/Products/Debug-iphoneos/LinhCompanion.app \
            /tmp/LinhCompanion-ios18plus-UNSIGNED.app.zip
          unzip -tq /tmp/LinhCompanion-ios18plus-UNSIGNED.app.zip
      - name: Lưu bản build không ký (không cài trực tiếp được)
        uses: actions/upload-artifact@v4
        with:
          name: Linh-ios18plus-UNSIGNED-app
          path: /tmp/LinhCompanion-ios18plus-UNSIGNED.app.zip
          if-no-files-found: error
          retention-days: 7
      - name: Kiểm thử bộ tính cục bộ
        run: |
          swiftc ios/LinhCompanion/Sources/GameInsight.swift \
            ios/LinhCompanion/Sources/LinhSharedStore.swift \
            ios/LinhCompanion/Sources/GameEvidenceLedger.swift \
            ios/LinhCompanion/Sources/GameReasoner.swift \
            ios/LinhCompanion/Tests/InsightTests.swift \
            -o /tmp/LinhInsightTests
          /tmp/LinhInsightTests
