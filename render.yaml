# Linh AI optional backend — FREE plan only. No service is deployed by this file alone.
services:
  - type: web
    name: linh-ai-free-gateway
    runtime: node
    plan: free
    region: singapore
    rootDir: gateway
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: LINH_ALLOWED_ORIGIN
        value: https://hoaianhdoan0209-hue.github.io
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: LINH_ACCESS_TOKEN
        sync: false
