name: Kiểm thử và xuất bản Linh Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
      - name: Chuẩn bị Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiểm thử Linh và bộ suy luận
        run: |
          python3 -m compileall -q stream-bridge/server.py stream-bridge/test_stream.py
          (cd stream-bridge && python3 -m unittest test_stream.py -v)
          node test-site.mjs
          node test-web-companion.cjs
          node test-web-dialogue.cjs
          node test-web-ai-bridge.cjs
          node test-web-image-memory.cjs
          node test-game-coach.cjs
          node test-build-systems.cjs
          node test-ss9-evidence-graph.cjs
          node test-rotation-lab.cjs
          node test-rotation-commands.cjs
          node test-prompt-strategy.cjs
          node test-thinking-guard.cjs
          node test-season-knowledge.cjs
          node test-web-game-brain.cjs
          node test-web-game-experiments.cjs
          node test-native.mjs
          node test-vision.cjs
          node test-learning.cjs
          node test-assistant.cjs
          node test-cloud.cjs
          node test-gateway.mjs
          node test-ai-providers.mjs
          node test-ai-vision.mjs
          node test-ai-grounding.mjs
          node test-vision-evidence.cjs
      - name: Kiểm tra thực thi Swift của bộ gợi ý gọn
        run: |
          swiftc ios/LinhCompanion/Sources/GameInsight.swift \
            ios/LinhCompanion/Sources/LinhSharedStore.swift \
            ios/LinhCompanion/Sources/GameEvidenceLedger.swift \
            ios/LinhCompanion/Sources/GameReasoner.swift \
            ios/LinhCompanion/Tests/InsightTests.swift \
            -o /tmp/linh-insight-tests
          /tmp/linh-insight-tests
      - name: Kiểm thử bộ hội thoại giọng nói Socrates trên Swift
        run: |
          swiftc ios/LinhCompanion/Sources/SeasonKnowledge.swift \
            ios/LinhCompanion/Sources/SocratesVoiceDialog.swift \
            ios/LinhCompanion/Tests/SocratesVoiceDialogTests.swift \
            -o /tmp/socrates-voice-tests
          /tmp/socrates-voice-tests
      - name: Chuẩn bị PWA và OCR cùng nguồn
        run: |
          set -euo pipefail
          mkdir -p dist/ocr/lang
          cp stat-schema.js build-systems.js ss9-evidence-graph.js rotation-lab.js rotation-commands.js prompt-strategy.js thinking-guard.js game-coach.js season-knowledge.js index.html web-companion.js web-dialogue.js web-ai-bridge.js web-vision-upload.js vision-evidence.js web-image-memory.js web-game-brain.js web-game-experiments.js legacy-dashboard.html vision-engine.js assistant-engine.js assistant-ui.js sw.js manifest.webmanifest icon.svg dist/
          touch dist/.nojekyll
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund tesseract.js@5.1.1 tesseract.js-core@5.1.1
          cp node_modules/tesseract.js/dist/tesseract.min.js dist/ocr/
          cp node_modules/tesseract.js/dist/worker.min.js dist/ocr/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm* dist/ocr/
          curl -fLsS --retry 3 https://tessdata.projectnaptha.com/4.0.0/eng.traineddata.gz -o dist/ocr/lang/eng.traineddata.gz
          curl -fLsS --retry 3 https://tessdata.projectnaptha.com/4.0.0/vie.traineddata.gz -o dist/ocr/lang/vie.traineddata.gz
          test -s dist/ocr/tesseract.min.js
          test -s dist/ocr/worker.min.js
          test -s dist/ocr/lang/eng.traineddata.gz
          test -s dist/ocr/lang/vie.traineddata.gz
          gzip -t dist/ocr/lang/eng.traineddata.gz
          gzip -t dist/ocr/lang/vie.traineddata.gz
          echo 'OCR library and language data bundled at the Linh origin.'
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Đóng gói GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - name: Xuất bản Linh
        id: publish
        uses: actions/deploy-pages@v4
