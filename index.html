<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linh">
<title>Linh</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(ellipse 60% 45% at 50% 55%,#19274c 0%,#101b38 35%,transparent 80%),radial-gradient(ellipse at 75% 0%,#131d3d,#070b18 65%);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
main{height:100dvh;width:100%;display:grid;place-items:center;overflow:hidden}
.stage{position:relative;width:min(82vw,350px);aspect-ratio:1;display:grid;place-items:center}
.stage:before{content:"";position:absolute;inset:2%;border-radius:50%;background:radial-gradient(circle,#3d70d040,#7b4bee18 40%,transparent 72%);filter:blur(21px);animation:breathe 5.2s ease-in-out infinite}
.linh{appearance:none;border:0;background:transparent;display:block;position:relative;width:220px;height:220px;max-width:68vw;max-height:68vw;touch-action:manipulation;cursor:pointer;animation:bob 3.8s ease-in-out infinite;filter:drop-shadow(0 24px 34px #090f29)}
.linh:focus-visible{outline:3px solid #8ae9f8;outline-offset:10px;border-radius:50%}
.linh .body{position:absolute;inset:10%;border-radius:49% 53% 49% 52%;background:radial-gradient(ellipse at 30% 18%,#f9ffff 0%,#aff6ff 19%,#74c5ff 37%,#706be0 79%,#a76df3 100%);box-shadow:inset 0 0 0 4px #ffffff54,inset -12px -18px 26px #4434a255,0 0 34px #7aa9ffa0;animation:wobble 4.1s ease-in-out infinite}
.linh .body:before{content:"";position:absolute;top:13%;left:19%;width:27%;height:12%;border-radius:50%;background:#ffffffb0;transform:rotate(-27deg);filter:blur(3px)}
.face{position:absolute;inset:0;pointer-events:none}
.eye{position:absolute;top:46%;width:12px;height:18px;border-radius:50%;background:#1d2c58;animation:blink 6.4s infinite}
.eye.l{left:37%}.eye.r{right:37%}
.cheek{position:absolute;top:58%;width:16px;height:10px;border-radius:50%;background:#ff9fc4a8}
.cheek.l{left:28%}.cheek.r{right:28%}
.mouth{position:absolute;top:59%;left:47%;width:15px;height:9px;border-bottom:3px solid #21315c;border-radius:0 0 50% 50%}
.linh.talking .mouth{height:17px;width:13px;top:57%;left:47%;background:#27336c;border-radius:50%;border:0}
.linh.talking .body{box-shadow:inset 0 0 0 4px #ffffff80,0 0 56px #81e8e3a0}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@keyframes bob{0%,100%{transform:translateY(4px)}50%{transform:translateY(-10px)}}
@keyframes breathe{0%,100%{transform:scale(.95);opacity:.75}50%{transform:scale(1.12);opacity:1}}
@keyframes wobble{0%,100%{border-radius:49% 53% 49% 52%;rotate:-2deg}50%{border-radius:54% 46% 53% 45%;rotate:3deg}}
@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="stage">
    <button type="button" class="linh" id="linh" aria-label="Linh. Chạm để nghe trạng thái.">
      <span class="body"></span>
      <span class="face"><span class="eye l"></span><span class="eye r"></span><span class="cheek l"></span><span class="cheek r"></span><span class="mouth"></span></span>
    </button>
  </div>
  <span class="sr-only" id="liveStatus" aria-live="polite"></span>
</main>
<script>
(()=>{
 'use strict';
 const linh=document.getElementById('linh');
 const live=document.getElementById('liveStatus');
 let timer;
 linh.addEventListener('click',()=>{
   // Safari PWA cannot stream the screen of another app. Never claim to be observing.
   const message='Linh chưa thể xem game khác qua Safari. Chế độ quan sát trực tiếp cần ứng dụng Linh trên iPhone và quyền chia sẻ màn hình của hệ thống.';
   live.textContent=message;
   linh.classList.add('talking');
   clearTimeout(timer);timer=setTimeout(()=>linh.classList.remove('talking'),2600);
   if('speechSynthesis' in window && 'SpeechSynthesisUtterance' in window){
     window.speechSynthesis.cancel();
     const speech=new SpeechSynthesisUtterance(message);
     speech.lang='vi-VN';speech.rate=1.05;
     speech.onend=()=>linh.classList.remove('talking');
     try{window.speechSynthesis.speak(speech)}catch(_){}
   }
 });
 if('serviceWorker' in navigator&&location.protocol==='https:'){
   navigator.serviceWorker.register('./sw.js').catch(()=>{});
 }
})();
</script>
</body>
</html>
