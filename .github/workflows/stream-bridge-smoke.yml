name: Linh Stream Bridge — Kiểm thử Docker, KHÔNG triển khai
on:
  push:
    paths:
      - 'stream-bridge/**'
      - '.github/workflows/stream-bridge-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-smoke:
    name: Build receiver and test privately on CI runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test OCR rule logic and secret handling
        run: |
          cd stream-bridge
          python3 -m unittest -v test_stream.py
      - name: Docker build (no Railway deployment)
        run: docker build --tag linh-stream-bridge:test ./stream-bridge
      - name: Test protected HTTP and nginx receiver configuration
        run: |
          set -euo pipefail
          docker run --name linh-stream-ci -d \
            -e STREAM_KEY='test-ci-stream-key-0123456789abcde' \
            -e STATUS_TOKEN='test-ci-status-token-9876543210abc' \
            -e PORT=8080 \
            -p 127.0.0.1:18880:8080 \
            linh-stream-bridge:test
          trap 'docker rm -f linh-stream-ci || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18880/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18880/healthz
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18880/status)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer wrong-token' \
            http://127.0.0.1:18880/status)" = 401
          curl -fsS -H 'Authorization: Bearer test-ci-status-token-9876543210abc' \
            http://127.0.0.1:18880/status | python3 -c \
              'import json,sys; x=json.load(sys.stdin); assert not x["active"]; assert x["last_idea"] is None'
          docker exec linh-stream-ci nginx -t -c /app/nginx.conf
          # Push a SYNTHETIC video to loopback RTMP; no iPhone, Discord, or Railway.
          # The test checks that the protected receiver really consumes frames.
          docker exec -d linh-stream-ci bash -c \
            "ffmpeg -hide_banner -loglevel warning -nostdin -re \
            -f lavfi -i testsrc2=size=960x540:rate=15 \
            -t 26 -an -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -f flv rtmp://127.0.0.1:1935/live/test-ci-stream-key-0123456789abcde \
            >/tmp/linh-ci-video.log 2>&1"
          # After enough seconds for ffmpeg to output a sampled frame,
          # last_frame_at becomes non-null if the complete path is wired.
          found=0
          for attempt in $(seq 1 25); do
            if curl -fsS -H 'Authorization: Bearer test-ci-status-token-9876543210abc' \
              http://127.0.0.1:18880/status | python3 -c \
              'import json,sys; d=json.load(sys.stdin); assert d["active"] and d["last_frame_at"] is not None' \
              >/dev/null 2>&1; then found=1; break; fi
            if [ $((attempt % 5)) -eq 0 ]; then
              curl -fsS -H 'Authorization: Bearer test-ci-status-token-9876543210abc' \
                http://127.0.0.1:18880/status | \
                python3 -c 'import json,sys; d=json.load(sys.stdin); print("RTMP state",d["phase"],"frames",d["frames_seen"],"error",d["last_error_type"])' || true
            fi
            sleep 1
          done
          if [ "$found" != 1 ]; then
            echo "FAIL: RTMP synthetic video did not reach OCR frame reader"
            docker exec linh-stream-ci bash -c "tail -n 30 /tmp/linh-ci-video.log" | \
              sed 's/test-ci-stream-key-0123456789abcde/[REDACTED]/g' || true
            curl -fsS -H 'Authorization: Bearer test-ci-status-token-9876543210abc' \
              http://127.0.0.1:18880/status || true
            docker logs linh-stream-ci | tail -30
            exit 1
          fi
          echo "PASS: synthetic RTMP frames reached Linh OCR loop"
          echo "PASS: Docker health, secret access, private RTMP config"
